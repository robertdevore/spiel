[package]
name = "spiel"
version = "1.0.0"
description = "Local-first push-to-talk dictation for macOS. Speak, and it lands where your cursor is."
authors = ["Spiel"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "spiel_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Audio capture
cpal = "0.15"

# Local transcription (embedded whisper.cpp via cmake — no network, no CLI)
whisper-rs = "0.12"

# Clipboard
arboard = "3"

# Model download (first run only) + integrity
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# AXIsProcessTrusted() wrapper for the Accessibility permission used by auto-paste.
macos-accessibility-client = "0.0.1"
# Synthesize a real Cmd+V keystroke (keycode + modifier flag), not a Unicode char.
core-graphics = "0.24"
# Track and restore the app that owned focus before Spiel's tray/settings UI was clicked.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "libc"] }

[profile.release]
strip = true
lto = true
