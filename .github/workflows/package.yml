name: Package apps

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon app and DMG
            os: macos-14
            xcode: "16.2"
            command: npm run package:mac
            artifact: Spiel-macOS-arm64
            paths: |
              release/artifacts/*_macOS_*.dmg
              release/artifacts/*_macOS_*.app.zip
          - name: macOS Intel app and DMG
            os: macos-15-intel
            xcode: "16.4"
            command: npm run package:mac
            artifact: Spiel-macOS-x64
            paths: |
              release/artifacts/*_macOS_*.dmg
              release/artifacts/*_macOS_*.app.zip
          - name: Windows installers
            os: windows-latest
            command: npm run package:windows
            artifact: Spiel-Windows
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux packages
            os: ubuntu-24.04
            command: npm run package:linux
            artifact: Spiel-Linux
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Configure macOS SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          cxx="$(xcrun --find clang++)"
          echo "SDKROOT=$sdk_path" >> "$GITHUB_ENV"
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "CXX=$cxx" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-I$sdk_path/usr/include/c++/v1 -U_XOPEN_SOURCE -include cstdint -include cstdio" >> "$GITHUB_ENV"
          printf '#include <array>\n#include <stdint.h>\n#include <stdio.h>\nint main() { int64_t value = 0; FILE *file = nullptr; std::array<int, 1> item{}; return value + (file != nullptr) + item[0]; }\n' |
            "$cxx" -D_DARWIN_C_SOURCE -D_XOPEN_SOURCE=600 -U_XOPEN_SOURCE -I"$sdk_path/usr/include/c++/v1" -isysroot "$sdk_path" -std=c++17 -x c++ -fsyntax-only -

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build package
        run: ${{ matrix.command }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.paths }}
